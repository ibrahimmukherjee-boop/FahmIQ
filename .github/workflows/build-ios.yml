name: Build FahmIQ & Submit to App Store
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BUNDLE_ID: com.seekconsultingltd.forgeiq
  TEAM_ID: RZG4B93C88
  APP_STORE_APP_ID: "6761907571"
  SCHEME: FahmIQ
  PROFILE_NAME: "FahmIQ AppStore Auto"

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Generate native iOS project
        working-directory: frontend
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: frontend/ios
        run: pod install

      - name: Install signing certificate
        env:
          P12_BASE64: ${{ secrets.P12_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          # Create temp keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISION_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/fahmiq.mobileprovision

          echo "✅ Signing credentials installed"

      - name: Build IPA
        working-directory: frontend/ios
        env:
          TEAM_ID: ${{ env.TEAM_ID }}
        run: |
          # Create export options plist
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>upload</string>
          </dict>
          </plist>
          EOF

          # Archive
          xcodebuild archive \
            -workspace FahmIQ.xcworkspace \
            -scheme FahmIQ \
            -archivePath $RUNNER_TEMP/FahmIQ.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="${{ env.PROFILE_NAME }}" \
            | tail -20

          echo "✅ Archive created"

          # Export IPA
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/FahmIQ.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist ExportOptions.plist \
            | tail -10

          echo "✅ IPA exported"
          ls -la $RUNNER_TEMP/export/

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: "9U8HZ8CRST"
          ASC_ISSUER_ID: "4c19f293-33c2-47d3-a911-766e694b8095"
          ASC_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          # Write API key
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          # Upload IPA
          xcrun altool --upload-app \
            -f $RUNNER_TEMP/export/*.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --type ios \
            --verbose

          echo "✅ Uploaded to App Store Connect!"
          echo "🎉 Go to App Store Connect → TestFlight to see the build"
          echo "📱 Then attach build to version 1.0 and Submit for Review"

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/signing.keychain-db 2>/dev/null || true
          rm -f $RUNNER_TEMP/cert.p12
